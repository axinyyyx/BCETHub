{% extends 'base.html' %}
{% load static %}

{% block title %}Study Materials - BCETHub{% endblock %}

{% block content %}
<div class="study-materials-container">
    <h1>Study Materials</h1>
    <hr>
    <div class="study-container">
        <a href="javascript:void(0);" 
           hx-get="{% url 'notes' %}" 
           hx-target="#materials-display-area" 
           hx-swap="innerHTML" 
           class="study-materials-link">Notes</a>

        <a href="javascript:void(0);" 
           hx-get="{% url 'pyq' %}" 
           hx-target="#materials-display-area" 
           hx-swap="innerHTML" 
           class="study-materials-link">Previous Year Questions</a>
    </div>

    <div id="materials-display-area" class="materials-content-area"></div>
</div>

<style>
    .study-materials-container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
        font-size: large;
        padding: 0 15px;
        box-sizing: border-box;
    }

    .study-materials-container hr {
        width: 100%;
        border: 1px solid #ccc;
        margin: 20px 0;
    }

    .study-container {
        width: 100%;
        max-width: 600px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
    }

    .study-materials-link {
        flex: 1;
        min-height: 44px;
        padding: 10px 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        text-decoration: none;
        color: #d8d7d7;
        text-align: center;
        cursor: pointer;
        
        display: inline-flex;
        align-items: center;
        justify-content: center;
        
        box-sizing: border-box;
        word-break: normal;
        overflow-wrap: break-word;
        line-height: 1.3;
        transition: background-color 0.3s, color 0.3s;
    }

    .study-materials-link:hover {
        background-color: #333;
        color: #fff;
    }

    /* Content injection box */
    .materials-content-area {
        width: 100%;
        max-width: 800px;
        margin-top: 25px;
        text-align: left;
    }

    .study-materials-container p {
        font-size: 1.2rem;
        color: #eb0202;
    }

    @media (max-width: 480px) {
        .study-container {
            flex-direction: column; 
            width: 100%;
        }

        .study-materials-link {
            width: 100%; 
        }
    }
</style>
{% endblock %}
