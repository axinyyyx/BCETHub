{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCET Hub - QR Code</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --border-color: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-muted: #94a3b8;
            --accent-blue-light: #60a5fa;
            --glow-color: rgba(37, 99, 235, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.15) 0%, transparent 70%),
                radial-gradient(circle at 80% 80%, rgba(30, 41, 59, 0.5) 0%, transparent 50%);
        }

        .poster-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 40px 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px var(--glow-color);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            position: relative;
            overflow: hidden;
        }

        .poster-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-blue-light), transparent);
            border-radius: 0 0 8px 8px;
        }

        .header-section h1 {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-blue-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 16px;
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 260px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .qr-wrapper:hover {
            transform: scale(1.02);
        }

        .qr-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            object-fit: contain;
        }

        .sub-text-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
        }

        .sub-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
            font-weight: 500;
            max-width: 360px;
        }

        .highlight-text {
            color: var(--text-primary);
            font-weight: 600;
        }

        .footer-credit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.82rem;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .footer-credit i {
            color: var(--accent-blue-light);
            width: 16px;
            height: 16px;
        }

        @media (max-width: 480px) {
            .poster-card {
                padding: 30px 20px;
                border-radius: 22px;
            }

            .header-section h1 {
                font-size: 1.2rem;
            }

            .sub-text {
                font-size: 0.88rem;
            }

            .qr-wrapper {
                max-width: 220px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="poster-card">
        <div class="header-section">
            <h1>BCET Hostel Daily Mess, Class Routine & Notes</h1>
        </div>

        <div class="qr-wrapper">
            <img src="{% static 'img/qr-code.png' %}" alt="BCET QR Code" class="qr-image">
        </div>

        <div class="sub-text-section">
            <p class="sub-text">
                Scan to check <span class="highlight-text">Today's Mess Menu</span> & <span class="highlight-text">Live Schedule</span>
            </p>
            
            <div class="footer-credit">
                <i data-lucide="heart"></i>
                <span>Built for <strong>BCETians</strong></span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
